---
name: FFWD from release-2.18 branch

# Synchronization release-2.18 -> backplane-5.0: every push to release-2.18 is
# fast-forwarded into backplane-5.0. This is one-directional (release-2.18 is the
# source of truth; backplane-5.0 only ever receives). Seeding is assumed done
# (both branches start at the same commit), so ongoing sync is ENABLED.
#
# Can also be triggered manually via workflow_dispatch.
on:
  workflow_dispatch:
  push:
    branches:
      - release-2.18


permissions: {}

concurrency:
  # Serialize runs so a manual (workflow_dispatch) and a push-triggered run
  # cannot race on the backplane-5.0 branch. Queue rather than cancel so no
  # fast-forward is silently dropped.
  group: ffwd-backplane-5.0
  cancel-in-progress: false

jobs:
  fast-forward:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TARGET_BRANCHES: backplane-5.0

    steps:
      - name: Checkout repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch all branches
        run: git fetch --all

      - name: Fast-forward release-2.18 commits into backplane branches
        run: |
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          for branch in ${TARGET_BRANCHES}; do
            echo "--- Fast-forwarding ${branch} ---"
            git checkout "${branch}"
            git merge --ff-only "${{ github.sha }}"
            git push origin "${branch}"
          done
